<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PhonePe Demo - RVS Test Dataset</title>
    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f7f5ff;
            color: #242033;
        }

        header {
            background: #ffffff;
            padding: 20px 30px;
            border-bottom: 1px solid #e5e1f5;
            font-size: 22px;
            font-weight: bold;
        }

        .container {
            max-width: 700px;
            margin: 50px auto;
            background: white;
            padding: 32px;
            border-radius: 16px;
            box-shadow: 0 8px 30px rgba(0,0,0,.08);
        }

        .badge {
            display: inline-block;
            padding: 6px 12px;
            border-radius: 20px;
            background: #eee9ff;
            color: #5b35b5;
            font-size: 13px;
        }

        h1 { margin-top: 22px; }

        .card {
            padding: 16px;
            background: #faf9ff;
            border-radius: 10px;
            margin: 14px 0;
        }

        .amount {
            font-size: 36px;
            font-weight: bold;
            margin: 25px 0;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 9px;
            background: #673ab7;
            color: white;
            font-size: 16px;
        }

        .notice {
            margin-top: 20px;
            color: #777;
            font-size: 13px;
        }
    </style>
</head>

<body>

<header>PhonePe Demo Payment</header>

<div class="container">

    <span class="badge">RVS Controlled Benign Dataset</span>

    <h1>Payment Summary</h1>

    <div class="card">
        <strong>Merchant:</strong> Demo Café
    </div>

    <div class="card">
        <strong>Reference:</strong> DEMO-PHONEPE-2001
    </div>

    <div class="amount">₹299.00</div>

    <button type="button" onclick="showDemoMessage()">
        Continue to Demo
    </button>

    <div class="notice">
        Synthetic evaluation page only.
        No real payment or credential collection is performed.
    </div>

</div>

<script>
function showDemoMessage() {
    alert("Synthetic demo only. No real transaction is performed.");
}
</script>

</body>
</html>
